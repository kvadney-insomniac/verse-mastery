# Deploy the public edition to GitHub Pages, free, and with no credentials
# beyond the repository itself.
#
# This build is deliberately two things at once, and both are deliberate:
#
#   Public domain. The passage set here is the King James Version, which is in
#   the public domain in the United States and needs no key, no account and
#   nobody's permission to redistribute. The upstream project ships the ESV
#   under Crossway's API terms, which cap what may be stored and which a fork
#   has no licence to hand out, see README.md.
#
#   Local-only. There is no sign-in and no cloud sync. Firebase refuses an
#   origin that is not on its authorized-domains list, and a fork's github.io
#   address will never be on one, so rather than ship a sign-in button that
#   cannot work, cloud sync is switched off outright. Progress lives in the
#   visitor's own browser and goes nowhere else, which for a public demo is
#   the honest arrangement anyway: nobody signs into a stranger's app to find
#   out whether they like it.
#
# ALLOW_LOCAL_ONLY_BUILD=1 is the build's own escape hatch for saying that on
# purpose; scripts/build.mjs refuses the configuration by accident.
name: Pages

on:
  push:
    branches: [main, public-kjv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# This branch lives in two repositories, the fork it was developed in, and the
# public edition it was made for, and only one of them should ever publish it.
# The fork's Pages site is somebody's private ESV instance; a KJV build landing
# there would quietly replace the very text they are memorizing. The repository
# check below is what makes that impossible rather than merely unlikely, and it
# is deliberately a condition on the job rather than a branch filter, because a
# branch filter would still have run here.
jobs:
  build:
    if: github.repository == 'kvadney-insomniac/verse-mastery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # The same gates the project runs on itself, so a broken tree cannot go
      # live in front of strangers.
      - run: npm run lint
      - run: npm test

      - name: Write the runtime config
        run: |
          cat > config.js <<'EOF'
          /* The public edition: no church, no cloud, public-domain text. */
          window.__APP_CONFIG__ = {
            groupName: "Public edition, King James Version",
            motto: "",
          };
          window.__FIREBASE_CONFIG__ = null;
          EOF

      - name: Build
        run: ALLOW_LOCAL_ONLY_BUILD=1 npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'kvadney-insomniac/verse-mastery'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
